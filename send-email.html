<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Email Button</title>
  <style>
    body {
      background: #0a3d24;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .btn-email {
      background: #3fa56b;
      color: #0a3d24;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;  
      padding: 18px 36px;
      border-radius: 40px;
      display: inline-block;
      cursor: pointer;
    }

    .btn-email:hover {
      background: #52c283;
    }
  </style>
</head>
<body>

  <a class="btn-email"
     href="https://mail.google.com/mail/?view=cm&fo=1&to=mikeanghelo43@gmail.com&su=Hello%20Ghelo"
     target="_blank"
     rel="noopener">
    Send Email
  </a>

</body>
</html>
